<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perch</title>
<meta name="description" content="Ekranının kenarına tüneyen çalışma ortamı. macOS için.">
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #fff; --card: #f5f5f7; --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --muted: #a1a1a6; --bg: #000; --card: #1d1d1f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
         -webkit-font-smoothing: antialiased; }
  main { max-width: 640px; margin: 0 auto; padding: 96px 24px; text-align: center; }
  h1 { font-size: 56px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 12px; }
  p.lead { font-size: 21px; color: var(--muted); margin: 0 0 40px; line-height: 1.4; }
  .btn { display: inline-block; padding: 12px 24px; border-radius: 980px; background: var(--accent);
         color: #fff; text-decoration: none; font-size: 17px; font-weight: 500; }
  .btn[aria-disabled="true"] { opacity: .5; pointer-events: none; }
  .note { margin-top: 16px; font-size: 13px; color: var(--muted); }
  footer { margin-top: 96px; font-size: 12px; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Perch</h1>
  <p class="lead">Ekranının kenarına tüneyen çalışma ortamı.<br>Hangi projede olduğunu bilir; notların, agent'ların, dosyaların ve müziğin ona göre şekillenir.</p>
  <a class="btn" href="#" aria-disabled="true">Yakında</a>
  <p class="note">macOS 15 ve üzeri · Apple Silicon</p>
  <footer>© 2026 Hamza Çakmak</footer>
</main>
</body>
</html>
